name: Run Portfolio Backtest (Rs 50k/trade, max 5)

on:
  workflow_dispatch:
    inputs:
      part:
        description: "both / daily / intraday"
        default: "both"

permissions:
  contents: write

concurrency:
  group: backtest-results
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run
        run: python portfolio_backtest.py --part "${{ inputs.part }}" | grep -v "^  downloading" | tee portfolio_output.txt
      - name: Save results to repo
        run: |
          RUN_DIR="results/portfolio_$(date -u +%Y-%m-%d_%H%M)"
          mkdir -p "$RUN_DIR"
          mv portfolio_*.csv portfolio_output.txt "$RUN_DIR"/ 2>/dev/null || true
          cp "$RUN_DIR"/portfolio_output.txt results/LATEST_PORTFOLIO.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Portfolio backtest results $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
      - name: Show summary
        if: always()
        run: |
          if [ -f results/LATEST_PORTFOLIO.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat results/LATEST_PORTFOLIO.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
