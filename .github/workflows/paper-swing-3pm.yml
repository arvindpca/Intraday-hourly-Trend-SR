# schedule re-register: 2026-10-26
name: Paper Swing 3PM Alert (pre-close signals)

on:
  schedule:
    # Asli time Market Clock (clock/jobs.json) deta hai: 3:00 PM (V1) / 3:02 PM (V2.1).
    # Ye sirf backup hai (GitHub schedule aksar late hota hai). 2:55 se pehle aur 3:22 ke baad alert skip.
    - cron: "32 9 * * 1-5"
    - cron: "37 9 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "1 = test message (market band ho tab). Market Clock bina input ke chalata hai = asli alert"
        default: "0"

permissions:
  contents: write

concurrency:
  group: paper-swing
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PRECLOSE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test || '0' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r paper_swing/requirements.txt
      - name: Run 3PM alert
        shell: bash
        run: python paper_swing/preclose_alert.py 2>&1 | grep -v "^  downloading"
      - name: Save log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_swing/state
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "3PM alert log $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
